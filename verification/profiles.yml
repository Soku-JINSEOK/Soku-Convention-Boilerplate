{
  "schemaVersion": 1,
  "format": "json-compatible-yaml",
  "profiles": {
    "fast": {
      "always": [
        "diff-whitespace",
        "diff-secret-scan",
        "repository-hygiene"
      ],
      "scopes": [
        "soku",
        "javascript-typescript-node",
        "python",
        "go",
        "java-spring",
        "mysql",
        "postgresql",
        "gcloud",
        "cloud-config",
        "infra-gcp"
      ],
      "excluded": [
        "race",
        "full-lifecycle",
        "cross-platform",
        "full-packaging",
        "full-vulnerability-scan"
      ]
    },
    "ci-quick": {
      "always": [
        "diff-whitespace",
        "scope-detection",
        "changed-syntax",
        "lockfile-consistency",
        "diff-secret-scan",
        "repository-hygiene"
      ],
      "scopes": [
        "soku",
        "javascript-typescript-node",
        "python",
        "go",
        "java-spring",
        "mysql",
        "postgresql",
        "gcloud",
        "cloud-config",
        "infra-gcp"
      ],
      "excluded": [
        "race",
        "full-lifecycle",
        "cross-platform",
        "full-packaging",
        "full-vulnerability-scan"
      ],
      "groups": [
        {
          "id": "always",
          "name": "Always-on repository checks",
          "runner": "always",
          "always": true,
          "scopes": [],
          "toolchains": [
            "node",
            "go"
          ]
        },
        {
          "id": "soku",
          "name": "Soku",
          "runner": "soku-fast",
          "scopes": [
            "soku"
          ],
          "toolchains": [
            "go"
          ]
        },
        {
          "id": "javascript-typescript-node",
          "name": "JavaScript and TypeScript template",
          "runner": "templates",
          "scopes": [
            "javascript-typescript-node"
          ],
          "toolchains": [
            "node"
          ]
        },
        {
          "id": "python",
          "name": "Python template",
          "runner": "templates",
          "scopes": [
            "python"
          ],
          "toolchains": [
            "python"
          ]
        },
        {
          "id": "go",
          "name": "Go template",
          "runner": "templates",
          "scopes": [
            "go"
          ],
          "toolchains": [
            "go"
          ]
        },
        {
          "id": "java-spring",
          "name": "Java and Spring template",
          "runner": "templates",
          "scopes": [
            "java-spring"
          ],
          "toolchains": [
            "java"
          ]
        },
        {
          "id": "database",
          "name": "Database schemas",
          "runner": "database-schema",
          "scopes": [
            "mysql",
            "postgresql"
          ],
          "toolchains": [
            "docker"
          ]
        },
        {
          "id": "cloud",
          "name": "Cloud templates",
          "runner": "templates",
          "scopes": [
            "gcloud",
            "cloud-config"
          ],
          "toolchains": [
            "node",
            "docker"
          ]
        },
        {
          "id": "infra-gcp",
          "name": "GCP infrastructure",
          "runner": "infrastructure",
          "scopes": [
            "infra-gcp"
          ],
          "toolchains": [
            "docker"
          ]
        }
      ]
    },
    "full": {
      "groups": [
        "repository-hygiene",
        "soku",
        "templates",
        "database-schema",
        "security",
        "infrastructure"
      ],
      "localReport": {
        "path": ".soku/verification/local-full.json",
        "authoritative": false
      }
    }
  }
}
