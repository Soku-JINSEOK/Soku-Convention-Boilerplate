# Local equivalents of the mysql/postgresql service containers used by the
# hosted templates-ci.yml workflow, so verification/commands/db-schema.sh can
# reproduce the schema-load checks on a developer machine. See
# verification/CLASSIFICATION.md for context.
services:
  mysql:
    image: ${MYSQL_IMAGE:-mysql:8.4.10@sha256:8dbcf531a03aade657e181b9cf2f1d1803ce621a1d55610cb44cb531ab7d7db6}
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: template_check
    ports:
      - "3306:3306"
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "--host=127.0.0.1",
          "--port=3306",
          "--protocol=tcp",
          "--user=root",
          "--silent",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16.14@sha256:33f923b05f64ca54ac4401c01126a6b92afe839a0aa0a52bc5aeb5cc958e5f20}
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: template_check
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
