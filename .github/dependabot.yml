version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
        patterns:
          - "*"
      security-updates:
        applies-to: security-updates
        patterns:
          - "*"
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
    assignees:
      - Soku-JINSEOK
    labels:
      - "type:chore"
      - "area:tooling"
    commit-message:
      prefix: "📦 build"
      include: "scope"
