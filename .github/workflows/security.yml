name: Security

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read
  pull-requests: read

jobs:
  history:
    name: Authenticated history and secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout complete repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Verify hash-locked historical baseline
        run: |
          python -m pip install \
            --disable-pip-version-check \
            --require-hashes \
            -r security/requirements-historical.txt
          python scripts/verify_historical_baseline.py

      - name: Scan complete history with Gitleaks
        run: >-
          docker run --rm
          --volume "${PWD}:/repository:ro"
          ghcr.io/gitleaks/gitleaks:v8.24.2@sha256:b5918eb91b8d2473cec722f066abb4352e4ffdc4ec9f4283ec143aba9ec9ebc4
          detect --source /repository --redact --no-banner

  dependencies:
    name: Dependency and license audits
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'

      - name: Audit JavaScript template dependencies
        working-directory: templates/javascript-typescript-node
        run: npm audit --audit-level=high

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Install pinned Python auditor
        run: python -m pip install --disable-pip-version-check pip-audit==2.10.0

      - name: Audit Python template lock
        working-directory: templates/python
        run: pip-audit --strict -r requirements-lock.txt

      - name: Audit declared licenses and notices
        shell: bash
        run: |
          test -s LICENSE
          test -s soku/THIRD_PARTY_NOTICES.md
          grep -En 'MIT|Apache|BSD|third[- ]party' soku/THIRD_PARTY_NOTICES.md

  go-vulnerabilities:
    name: Go vulnerability checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - soku
          - templates/go
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.x'
          cache-dependency-path: soku/go.sum

      - name: Run govulncheck
        working-directory: ${{ matrix.module }}
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...

  osv:
    name: OSV dependency scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run OSV scanner
        run: >-
          docker run --rm
          --volume "${PWD}:/repository:ro"
          ghcr.io/google/osv-scanner:v2.4.0@sha256:5116601dedc01c1c580eb92371883ec052fc4c13c3fbc109d621a63ac416d475
          scan source -r /repository --experimental-exclude /repository/.git
          --no-resolve
