name: Validation

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - edited
      - labeled
      - unlabeled
      - assigned
      - unassigned
      - ready_for_review
      - converted_to_draft
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

jobs:
  quick:
    name: Quick validation
    if: >-
      github.event_name != 'pull_request' ||
      github.event.action == 'opened' ||
      github.event.action == 'synchronize' ||
      github.event.action == 'reopened' ||
      (github.event.action == 'edited' && github.event.changes.base != null)
    concurrency:
      group: validation-quick-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    uses: ./.github/workflows/ci-quick.yml
    with:
      base-sha: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
      head-sha: ${{ github.event.pull_request.head.sha || github.sha }}

  quick-not-required:
    name: CI Quick Not Required
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action != 'opened' &&
      github.event.action != 'synchronize' &&
      github.event.action != 'reopened' &&
      !(github.event.action == 'edited' && github.event.changes.base != null)
    runs-on: ubuntu-latest
    steps:
      - run: echo "Metadata-only event preserves the existing CI Quick Gate."

  ci-quick-gate:
    name: CI Quick Gate
    if: always()
    needs:
      - quick
      - quick-not-required
    runs-on: ubuntu-latest
    steps:
      - name: Require quick validation
        env:
          QUICK_RESULT: ${{ needs.quick.result }}
          NOT_REQUIRED_RESULT: ${{ needs.quick-not-required.result }}
        run: |
          if [[ "$QUICK_RESULT" = success &&
                "$NOT_REQUIRED_RESULT" = skipped ]]; then
            exit 0
          fi
          if [[ "$QUICK_RESULT" = skipped &&
                "$NOT_REQUIRED_RESULT" = success ]]; then
            exit 0
          fi
          exit 1

  verified-image:
    name: Build verified Cloud Run image
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      github.repository == 'Soku-JINSEOK/Soku-Convention-Boilerplate' &&
      vars.GCP_CI_WIF_PROVIDER != '' &&
      vars.GCP_CI_WIF_SERVICE_ACCOUNT != ''
    needs:
      - quick
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout exact main source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}

      - name: Authenticate CI builder to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_CI_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_CI_WIF_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Build, smoke, push, and resolve immutable digest
        shell: bash
        run: |
          scripts/build-verified-image.sh \
            --project-id "${{ vars.GCP_PROJECT_ID }}" \
            --region "${{ vars.GCP_REGION }}" \
            --artifact-repository "${{ vars.GCP_ARTIFACT_REPOSITORY }}" \
            --image-repository "${{ vars.GCP_SERVICE_NAME }}" \
            --source-sha "${{ github.sha }}" \
            --source-ref "${{ github.ref }}" \
            --repository "${{ github.repository }}" \
            --workflow-run-id "${{ github.run_id }}" \
            --manifest "${{ github.workspace }}/verified-cloud-run-image/manifest.json"

      - name: Upload verified image manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-cloud-run-image
          path: ${{ github.workspace }}/verified-cloud-run-image/manifest.json
          if-no-files-found: error
          retention-days: 30

  repository:
    name: Full repository validation
    if: >-
      github.event_name != 'pull_request' ||
      github.event.action == 'opened' ||
      github.event.action == 'synchronize' ||
      github.event.action == 'reopened' ||
      (github.event.action == 'edited' && github.event.changes.base != null)
    concurrency:
      group: validation-full-repository-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    uses: ./.github/workflows/ci.yml

  templates:
    name: Full runtime-template validation
    if: >-
      github.event_name != 'pull_request' ||
      github.event.action == 'opened' ||
      github.event.action == 'synchronize' ||
      github.event.action == 'reopened' ||
      (github.event.action == 'edited' && github.event.changes.base != null)
    concurrency:
      group: validation-full-templates-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    uses: ./.github/workflows/templates-ci.yml

  security:
    name: Security validation
    if: >-
      github.event_name != 'pull_request' ||
      github.event.action == 'opened' ||
      github.event.action == 'synchronize' ||
      github.event.action == 'reopened' ||
      (github.event.action == 'edited' && github.event.changes.base != null)
    concurrency:
      group: validation-full-security-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    uses: ./.github/workflows/security.yml
    with:
      base-sha: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
      head-sha: ${{ github.event.pull_request.head.sha || github.sha }}

  validation-gate:
    name: Validation Gate
    if: always()
    needs:
      - repository
      - templates
      - security
      - full-validation-not-required
    runs-on: ubuntu-latest
    concurrency:
      group: validation-full-gate-${{ github.event.pull_request.number || github.ref }}-${{ needs.full-validation-not-required.result == 'success' && github.run_id || 'code' }}
      cancel-in-progress: true
    steps:
      - name: Require every validation group
        env:
          REPOSITORY_RESULT: ${{ needs.repository.result }}
          TEMPLATES_RESULT: ${{ needs.templates.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
          NOT_REQUIRED_RESULT: ${{ needs.full-validation-not-required.result }}
        shell: bash
        run: |
          if [[ "$REPOSITORY_RESULT" = success &&
                "$TEMPLATES_RESULT" = success &&
                "$SECURITY_RESULT" = success &&
                "$NOT_REQUIRED_RESULT" = skipped ]]; then
            exit 0
          fi
          if [[ "$REPOSITORY_RESULT" = skipped &&
                "$TEMPLATES_RESULT" = skipped &&
                "$SECURITY_RESULT" = skipped &&
                "$NOT_REQUIRED_RESULT" = success ]]; then
            exit 0
          fi
          exit 1

  full-validation-not-required:
    name: Full Validation Not Required
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action != 'opened' &&
      github.event.action != 'synchronize' &&
      github.event.action != 'reopened' &&
      !(github.event.action == 'edited' && github.event.changes.base != null)
    runs-on: ubuntu-latest
    steps:
      - run: echo "Metadata-only event preserves the existing Validation Gate."
