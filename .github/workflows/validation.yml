name: Validation

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - edited
      - labeled
      - unlabeled
      - assigned
      - unassigned
      - ready_for_review
      - converted_to_draft
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

jobs:
  quick:
    name: Quick validation
    if: >-
      github.event_name != 'pull_request' ||
      github.event.action == 'opened' ||
      github.event.action == 'synchronize' ||
      github.event.action == 'reopened' ||
      (github.event.action == 'edited' && github.event.changes.base != null)
    concurrency:
      group: validation-quick-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    uses: ./.github/workflows/ci-quick.yml
    with:
      base-sha: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
      head-sha: ${{ github.event.pull_request.head.sha || github.sha }}

  quick-not-required:
    name: CI Quick Not Required
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action != 'opened' &&
      github.event.action != 'synchronize' &&
      github.event.action != 'reopened' &&
      !(github.event.action == 'edited' && github.event.changes.base != null)
    runs-on: ubuntu-latest
    steps:
      - run: echo "Metadata-only event preserves the existing CI Quick Gate."

  ci-quick-gate:
    name: CI Quick Gate
    if: always()
    needs:
      - quick
      - quick-not-required
    runs-on: ubuntu-latest
    steps:
      - name: Require quick validation
        env:
          QUICK_RESULT: ${{ needs.quick.result }}
          NOT_REQUIRED_RESULT: ${{ needs.quick-not-required.result }}
        run: |
          if [[ "$QUICK_RESULT" = success &&
                "$NOT_REQUIRED_RESULT" = skipped ]]; then
            exit 0
          fi
          if [[ "$QUICK_RESULT" = skipped &&
                "$NOT_REQUIRED_RESULT" = success ]]; then
            exit 0
          fi
          exit 1

  repository:
    name: Full repository validation
    if: >-
      github.event_name != 'pull_request' ||
      github.event.action == 'opened' ||
      github.event.action == 'synchronize' ||
      github.event.action == 'reopened' ||
      (github.event.action == 'edited' && github.event.changes.base != null)
    concurrency:
      group: validation-full-repository-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    uses: ./.github/workflows/ci.yml

  templates:
    name: Full runtime-template validation
    if: >-
      github.event_name != 'pull_request' ||
      github.event.action == 'opened' ||
      github.event.action == 'synchronize' ||
      github.event.action == 'reopened' ||
      (github.event.action == 'edited' && github.event.changes.base != null)
    concurrency:
      group: validation-full-templates-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    uses: ./.github/workflows/templates-ci.yml

  security:
    name: Security validation
    if: >-
      github.event_name != 'pull_request' ||
      github.event.action == 'opened' ||
      github.event.action == 'synchronize' ||
      github.event.action == 'reopened' ||
      (github.event.action == 'edited' && github.event.changes.base != null)
    concurrency:
      group: validation-full-security-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    uses: ./.github/workflows/security.yml
    with:
      base-sha: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
      head-sha: ${{ github.event.pull_request.head.sha || github.sha }}

  validation-gate:
    name: Validation Gate
    if: always()
    needs:
      - repository
      - templates
      - security
      - full-validation-not-required
    runs-on: ubuntu-latest
    concurrency:
      group: validation-full-gate-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - name: Require every validation group
        env:
          REPOSITORY_RESULT: ${{ needs.repository.result }}
          TEMPLATES_RESULT: ${{ needs.templates.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
          NOT_REQUIRED_RESULT: ${{ needs.full-validation-not-required.result }}
        shell: bash
        run: |
          if [[ "$REPOSITORY_RESULT" = success &&
                "$TEMPLATES_RESULT" = success &&
                "$SECURITY_RESULT" = success &&
                "$NOT_REQUIRED_RESULT" = skipped ]]; then
            exit 0
          fi
          if [[ "$REPOSITORY_RESULT" = skipped &&
                "$TEMPLATES_RESULT" = skipped &&
                "$SECURITY_RESULT" = skipped &&
                "$NOT_REQUIRED_RESULT" = success ]]; then
            exit 0
          fi
          exit 1

  full-validation-not-required:
    name: Full Validation Not Required
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action != 'opened' &&
      github.event.action != 'synchronize' &&
      github.event.action != 'reopened' &&
      !(github.event.action == 'edited' && github.event.changes.base != null)
    runs-on: ubuntu-latest
    concurrency:
      group: validation-metadata-not-required-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - run: echo "Metadata-only event preserves the existing Validation Gate."
