name: Validation

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - edited
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

jobs:
  hosted-full:
    name: Exact-head Hosted Full
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/full-validation.yml
    with:
      base-sha: ${{ github.sha }}
      head-sha: ${{ github.sha }}

  quick:
    name: Quick validation
    concurrency:
      group: validation-quick-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    uses: ./.github/workflows/ci-quick.yml
    with:
      base-sha: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
      head-sha: ${{ github.event.pull_request.head.sha || github.sha }}

  ci-quick-gate:
    name: CI Quick Gate
    if: always()
    needs:
      - quick
    runs-on: ubuntu-latest
    steps:
      - name: Require quick validation
        env:
          QUICK_RESULT: ${{ needs.quick.result }}
        shell: bash
        run: |
          test "$QUICK_RESULT" = success

  repository:
    name: Full repository validation
    concurrency:
      group: validation-full-repository-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    uses: ./.github/workflows/ci.yml

  templates:
    name: Full runtime-template validation
    concurrency:
      group: validation-full-templates-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    uses: ./.github/workflows/templates-ci.yml

  security:
    name: Security validation
    concurrency:
      group: validation-full-security-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    uses: ./.github/workflows/security.yml
    with:
      base-sha: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
      head-sha: ${{ github.event.pull_request.head.sha || github.sha }}

  validation-gate:
    name: Validation Gate
    if: always()
    needs:
      - repository
      - templates
      - security
    runs-on: ubuntu-latest
    concurrency:
      group: validation-full-gate-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - name: Require every validation group
        env:
          REPOSITORY_RESULT: ${{ needs.repository.result }}
          TEMPLATES_RESULT: ${{ needs.templates.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
        shell: bash
        run: |
          set -euo pipefail
          test "$REPOSITORY_RESULT" = success
          test "$TEMPLATES_RESULT" = success
          test "$SECURITY_RESULT" = success
