name: CI Quick

on:
  workflow_call:
    inputs:
      base-sha:
        description: Base commit for changed-scope detection
        required: true
        type: string
      head-sha:
        description: Head commit for changed-scope detection
        required: true
        type: string

permissions:
  contents: read

jobs:
  plan:
    name: Plan changed-scope shards
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Checkout exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.head-sha }}

      - name: Detect scopes and plan shards
        id: plan
        shell: bash
        run: |
          node scripts/detect-verification-scope.mjs \
            --workspace . \
            --base '${{ inputs.base-sha }}' \
            --head '${{ inputs.head-sha }}' \
            --json > ci-quick-scopes.json
          matrix="$(
            node scripts/plan-ci-quick.mjs \
              --scope-json ci-quick-scopes.json \
              --profiles verification/profiles.yml
          )"
          printf 'matrix=%s\n' "$matrix" >> "$GITHUB_OUTPUT"

  quick:
    name: Quick / ${{ matrix.name }}
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Checkout exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.head-sha }}

      - name: Setup Node.js
        if: contains(matrix.toolchains, 'node')
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"

      - name: Setup Go
        if: contains(matrix.toolchains, 'go')
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.x"
          cache-dependency-path: |
            soku/go.sum
            templates/go/go.mod

      - name: Setup Python
        if: contains(matrix.toolchains, 'python')
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Setup Java
        if: contains(matrix.toolchains, 'java')
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Run planned quick shard
        shell: bash
        run: >-
          ./scripts/verify.sh --profile ci-quick
          --group '${{ matrix.id }}'
          --base '${{ inputs.base-sha }}'
          --head '${{ inputs.head-sha }}'
