name: CI Quick

on:
  workflow_call:
    inputs:
      base-sha:
        description: Base commit for changed-scope detection
        required: true
        type: string
      head-sha:
        description: Head commit for changed-scope detection
        required: true
        type: string

permissions:
  contents: read

jobs:
  quick:
    name: Changed-scope verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.head-sha }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.x"

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Setup Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Run fail-closed quick verification
        shell: bash
        run: >-
          ./scripts/verify.sh --profile ci-quick
          --base '${{ inputs.base-sha }}'
          --head '${{ inputs.head-sha }}'
