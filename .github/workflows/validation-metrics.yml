name: Validation metrics

on:
  workflow_run:
    workflows: [Validation]
    types: [completed]

permissions:
  contents: read
  actions: read

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      # workflow_run uses trusted default-branch code, never the measured PR.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
      - name: Collect this attempt, including failures and cancellations
        env:
          GH_TOKEN: ${{ github.token }}
          METRICS_REPOSITORY: ${{ github.repository }}
          METRICS_RUN_ID: ${{ github.event.workflow_run.id }}
          METRICS_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: >-
          node scripts/collect-validation-metrics.mjs
          "$METRICS_REPOSITORY" "$METRICS_RUN_ID" "$METRICS_ATTEMPT"
          > validation-metrics.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: validation-metrics-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
          path: validation-metrics.json
          retention-days: 30
          if-no-files-found: error
