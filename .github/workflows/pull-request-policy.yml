name: Pull Request Policy

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - edited
      - labeled
      - unlabeled
      - assigned
      - unassigned
      - ready_for_review
      - converted_to_draft

permissions:
  contents: read
  pull-requests: read

jobs:
  policy:
    name: PR Metadata Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted policy source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false
          path: trusted-policy
          ref: ${{ github.event.pull_request.base.sha }}

      - name: Checkout authenticated pull request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
          path: pr-head
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"

      - name: Read and authenticate current pull request metadata
        id: metadata
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          metadata_dir="$(mktemp -d)"
          chmod 700 "$metadata_dir"
          cleanup() {
            rm -f \
              "$metadata_dir/current.json" \
              "$metadata_dir/files.json" \
              "$metadata_dir/event.json"
            rmdir "$metadata_dir"
          }
          trap cleanup EXIT
          install -m 600 /dev/null "$metadata_dir/current.json"
          install -m 600 /dev/null "$metadata_dir/files.json"
          install -m 600 /dev/null "$metadata_dir/event.json"
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" \
            > "$metadata_dir/current.json"
          gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files?per_page=100" \
            --jq '.[].filename' \
            | jq -R -s 'split("\n") | map(select(length > 0))' \
            > "$metadata_dir/files.json"
          CURRENT_METADATA_PATH="$metadata_dir/current.json" \
          FILES_METADATA_PATH="$metadata_dir/files.json" \
          AUTHENTICATED_EVENT_PATH="$metadata_dir/event.json" \
          PR_HEAD_WORKSPACE="$GITHUB_WORKSPACE/pr-head" \
            node --input-type=module - <<'NODE'
          import {readFileSync, writeFileSync} from 'node:fs';
          import {runPullRequestPolicy} from './trusted-policy/scripts/pull-request-policy.mjs';

          const readJson = (path) => JSON.parse(readFileSync(path, 'utf8'));
          const event = readJson(process.env.GITHUB_EVENT_PATH);
          const current = readJson(process.env.CURRENT_METADATA_PATH);
          const files = readJson(process.env.FILES_METADATA_PATH);
          const expectedNumber = Number(process.env.PR_NUMBER);
          const checks = [
            ['event repository', event.repository?.full_name, process.env.GITHUB_REPOSITORY],
            ['API base repository', current.base?.repo?.full_name, process.env.GITHUB_REPOSITORY],
            ['event pull request number', event.pull_request?.number, expectedNumber],
            ['API pull request number', current.number, expectedNumber],
            ['event head repository', event.pull_request?.head?.repo?.full_name, process.env.PR_HEAD_REPOSITORY],
            ['API head repository', current.head?.repo?.full_name, process.env.PR_HEAD_REPOSITORY],
            ['event head SHA', event.pull_request?.head?.sha, process.env.PR_HEAD_SHA],
            ['API head SHA', current.head?.sha, process.env.PR_HEAD_SHA],
          ];
          const mismatches = checks.filter(([, actual, expected]) => (
            !expected || actual !== expected
          ));
          if (mismatches.length > 0) {
            throw new Error(mismatches.map(([label]) => (
              `${label} does not match the trusted event value`
            )).join('\n'));
          }
          if (!Array.isArray(files) || files.some((file) => typeof file !== 'string')) {
            throw new Error('changed files must be an array of strings');
          }
          writeFileSync(
            process.env.AUTHENTICATED_EVENT_PATH,
            `${JSON.stringify({pull_request: {...current, changed_files_list: files}})}\n`,
            {mode: 0o600},
          );
          process.exitCode = runPullRequestPolicy({
            eventPath: process.env.AUTHENTICATED_EVENT_PATH,
            repositoryRoot: `${process.env.PR_HEAD_WORKSPACE}/`,
          });
          NODE

      - name: Validate pull request and commit titles
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_HEAD_WORKSPACE: ${{ github.workspace }}/pr-head
        shell: bash
        run: |
          node --test \
            trusted-policy/scripts/contribution-title.test.mjs \
            trusted-policy/templates/_shared/commitlint/contribution-title.test.mjs
          node --input-type=module - <<'NODE'
          import {execFileSync} from 'node:child_process';
          import {
            contributionTitleOptionsForPullRequest,
            validateContributionTitle,
          } from './trusted-policy/scripts/contribution-title.mjs';
          const git = (...args) => execFileSync(
            'git', args, {cwd: process.env.PR_HEAD_WORKSPACE, encoding: 'utf8'},
          ).trim();
          const mergeBase = git('merge-base', process.env.BASE_SHA, process.env.HEAD_SHA);
          const titles = git(
            'log', '--no-merges', '--format=%s', `${mergeBase}..${process.env.HEAD_SHA}`,
          ).split('\n').filter(Boolean);
          const options = contributionTitleOptionsForPullRequest(
            process.env.PR_AUTHOR ?? '', process.env.PR_HEAD_REF ?? '',
          );
          const checks = [['PR title', process.env.PR_TITLE ?? '']]
            .concat(titles.map((title) => ['commit title', title]));
          const failures = checks.filter(([source, title]) => {
            const result = validateContributionTitle(title, options);
            if (!result.valid) console.error(`✗ [${source}] ${result.message}`);
            return !result.valid;
          });
          if (failures.length > 0) process.exit(1);
          NODE

  validation-gate:
    name: Validation Gate
    if: always()
    needs:
      - policy
    runs-on: ubuntu-latest
    steps:
      - name: Preserve the required validation result contract
        env:
          POLICY_RESULT: ${{ needs.policy.result }}
        shell: bash
        run: test "$POLICY_RESULT" = success
