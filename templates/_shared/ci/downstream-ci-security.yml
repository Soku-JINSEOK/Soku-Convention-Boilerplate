name: Security

# Weekly/manual security validation for downstream repositories.
# Soku renders only the ecosystem audit blocks matching selected stacks.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * 1"

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26'
      - run: >-
          go run github.com/zricethezav/gitleaks/v8@v8.24.2
          detect --source . --no-banner

